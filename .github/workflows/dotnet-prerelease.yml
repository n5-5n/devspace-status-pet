name: Publish .NET release

on:
  push:
    tags:
      - 'v0.2.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches DOTNET_VERSION
        shell: powershell
        run: |
          $version = [System.IO.File]::ReadAllText("$PWD\DOTNET_VERSION").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match DOTNET_VERSION $version"
          }

      - name: Validate scripts and compatibility layer
        shell: powershell
        run: .\tests\ParseScripts.ps1

      - name: Build .NET release package
        shell: powershell
        run: .\scripts\Build-DotNetRelease.ps1 | Format-List

      - name: Smoke-test self-install and self-uninstall
        shell: powershell
        run: |
          $version = [System.IO.File]::ReadAllText("$PWD\DOTNET_VERSION").Trim()
          $exe = ".\artifacts\DevSpace-Status-Pet-v$version-win-x64-publish\DevSpaceStatusPet.exe"
          .\tests\DotNetInstallSmoke.ps1 -ExecutablePath $exe

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [System.IO.File]::ReadAllText("$PWD\DOTNET_VERSION").Trim()
          $zip = "artifacts\DevSpace-Status-Pet-v$version-win-x64.zip"
          $hash = "$zip.sha256"
          $arguments = @(
            'release', 'create', "${{ github.ref_name }}", $zip, $hash,
            '--verify-tag',
            '--title', "DevSpace Status Pet v$version",
            '--notes-file', 'RELEASE_NOTES.v0.2.md'
          )
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE"
          }
